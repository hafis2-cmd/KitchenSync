<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle with soft gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" />
  
  <!-- Outer glowing rings indicating Sync/AI -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#60A5FA" stroke-width="8" stroke-dasharray="40 20" opacity="0.6" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#93C5FD" stroke-width="4" stroke-dasharray="10 10" opacity="0.4" />

  <!-- Restaurant Cloche / Bell -->
  <!-- Cloche handle -->
  <circle cx="256" cy="160" r="20" fill="url(#grad2)" />
  <!-- Cloche dome -->
  <path d="M 140 320 C 140 200, 372 200, 372 320 Z" fill="url(#grad2)" />
  <!-- Cloche base plate -->
  <rect x="110" y="325" width="292" height="18" rx="9" fill="#FFFFFF" />
  <!-- Cloche shine/highlight -->
  <path d="M 170 300 C 170 240, 230 200, 270 200" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5" />
</svg>
